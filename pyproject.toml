[project]
name = "eac-audit-standards"
version = "0.1.0"
description = "Pipeline to download, normalize, and summarize EAC draft audit standards and public comments."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "tenacity>=9.0.0",
    "python-docx>=1.1.2",
    "pymupdf4llm>=0.0.17",
    "markitdown[docx,pdf]>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
